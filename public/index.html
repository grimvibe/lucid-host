<!-- Sign in / create account -->
<div id="authView" class="auth-view" hidden>
  <div class="auth-card glow-card">
    <div class="auth-brand">
      <svg class="logo-mark"><use href="#i-logo"/></svg>
      <div>
        <div class="brand-name">Lucid <span>Host</span></div>
        <div class="brand-tag">Your Bots. Our Power.</div>
      </div>
    </div>

    <h1 id="authTitle">Sign in</h1>
    <p class="muted" id="authSubtitle">Welcome back. Sign in to manage your bots.</p>

    <form id="authForm" autocomplete="on" novalidate>
      <label class="field" id="emailField" hidden>
        <span>Email</span>
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" maxlength="120">
      </label>
      <label class="field">
        <span id="usernameLabel">Username or email</span>
        <input id="authUsername" type="text" autocomplete="username" placeholder="your-username" maxlength="120" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters" maxlength="128" required>
      </label>
      <button class="btn primary block" id="authSubmit" type="submit">Sign in</button>
      <div class="form-message" id="authMessage" role="alert"></div>
    </form>

    <p class="muted auth-switch" id="authSwitchWrap">
      <span id="authSwitchText">New here?</span>
      <button class="link-btn" id="authSwitch" type="button">Create an account</button>
    </p>
  </div>
</div>

<!-- Main application -->
<div id="appView" class="app-view" hidden>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <svg class="logo-mark"><use href="#i-logo"/></svg>
        <div>
          <div class="brand-name">Lucid <span>Host</span></div>
          <div class="brand-tag">Your Bots. Our Power.</div>
        </div>
      </a>

      <nav class="nav" id="nav"></nav>

      <div class="user-card">
        <button class="user-btn" id="userBtn" type="button" aria-haspopup="true">
          <span class="avatar" id="userAvatar">A</span>
          <span class="user-text">
            <strong id="userName">User</strong>
            <small id="userRole">User</small>
          </span>
          <svg class="icon sm"><use href="#i-chevron"/></svg>
        </button>
        <div class="menu up" id="userMenu" hidden>
          <button type="button" data-action="goto-settings">Settings</button>
          <button type="button" data-action="logout">Sign out</button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Open menu">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>

        <label class="search">
          <svg class="icon sm"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="Search projects, users, or IDs..." autocomplete="off">
        </label>

        <div class="top-actions">
          <div class="bell-wrap">
            <button class="icon-btn" id="bellBtn" type="button" aria-label="Notifications">
              <svg class="icon"><use href="#i-bell"/></svg>
              <span class="badge" id="bellBadge" hidden>0</span>
            </button>
            <div class="popover" id="notifPanel" hidden></div>
          </div>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
            <svg class="icon"><use href="#i-moon"/></svg>
          </button>
          <span class="pill online" id="apiPill"><i></i><span>Online</span></span>
          <a class="host-pill" href="#/settings">
            <i class="dot"></i>
            <span><strong>Lucid Host</strong><small id="versionText">v2.0.0</small></span>
            <span class="shield"><svg class="icon sm"><use href="#i-shield"/></svg></span>
          </a>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>

<script src="/js/app.js"></script>
</body>
</html>
